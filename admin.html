
<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мудирияти Mastchoh Shop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f3; color: #17352b;
    }
    .wrap { max-width: 700px; margin: auto; }
    .card {
      background: white; padding: 18px; margin-bottom: 16px;
      border-radius: 16px; box-shadow: 0 3px 14px #0000000c;
    }
    h1 { font-size: 24px; color: #087f5b; }
    h2 { font-size: 19px; }
    input, button, select {
      width: 100%; padding: 13px; margin: 7px 0;
      border: 1px solid #ccd8d1; border-radius: 9px;
      font-size: 16px;
    }
    button {
      background: #087f5b; color: white;
      border: 0; font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #52675e; }
    button.danger { background: #c0392b; }
    button:disabled { opacity: .55; }
    .hidden { display: none !important; }
    .msg { white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
    .product {
      border: 1px solid #e0e8e3; border-radius: 12px;
      padding: 12px; margin: 10px 0;
    }
    .product img, #preview {
      max-width: 100%; width: 150px; max-height: 160px;
      object-fit: contain; border-radius: 8px;
    }
    .muted { color: #60736a; font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🛍️ Mastchoh Shop</h1>
  <p class="muted">Панели идоракунии мағоза</p>

  <section class="card" id="loginCard">
    <h2>Воридшавии маъмур</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email"
        autocomplete="username" value="beriloro03@gmail.com" required>

      <label for="password">Парол</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="loginBtn" type="submit">Ворид шудан</button>
    </form>
    <p id="loginMsg" class="msg" role="status"></p>
  </section>

  <section id="adminArea" class="hidden">
    <div class="card">
      <h2>Идоракунӣ</h2>
      <p id="welcome"></p>
      <button id="logoutBtn" class="secondary">Баромадан</button>
    </div>

    <div class="card">
      <h2 id="formTitle">➕ Иловаи моли нав</h2>
      <form id="productForm">
        <label for="name">Номи мол</label>
        <input id="name" maxlength="100" required
          placeholder="Масалан: Зарядник Type-C">

        <label for="price">Нарх (сомонӣ)</label>
        <input id="price" type="number" min="0" step="0.01"
          required placeholder="25">

        <label for="category">Категория</label>
        <input id="category" maxlength="60" required
          placeholder="Масалан: chargers">

        <label for="imageFile">Акс аз галереяи телефон</label>
        <input id="imageFile" type="file" accept="image/*">
        <img id="preview" class="hidden" alt="Пешнамоиши акс">
        <p class="muted">Акс пеш аз сабт хурд карда мешавад.</p>

        <label for="imageUrl">Ё пайванди акс (ихтиёрӣ)</label>
        <input id="imageUrl" type="url"
          placeholder="https://example.com/photo.jpg">

        <button id="saveBtn" type="submit">Сабти мол</button>
        <button id="cancelEdit" type="button"
          class="secondary hidden">Бекор кардани таҳрир</button>
      </form>
      <p id="formMsg" class="msg" role="status"></p>
    </div>

    <div class="card">
      <h2>📦 Молҳои мағоза</h2>
      <p id="listMsg" class="msg"></p>
      <div id="productsList"></div>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
"use strict";

// Танзимоти лоиҳаи мавҷудаи Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDXMXpbPwTWxPIXLDtcuF-XxtLfEmtBfe0",
  authDomain: "mastchoh-shop-4a490.firebaseapp.com",
  projectId: "mastchoh-shop-4a490",
  storageBucket: "mastchoh-shop-4a490.firebasestorage.app",
  messagingSenderId: "948589793868",
  appId: "1:948589793868:web:cc2050951f2d452a0b5ae9"
};

// UID-и маъмури иҷозатдодашуда
const ADMIN_UID = "fpry8BO43fNPvnbmwymfZ6QMS9f2";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const $ = id => document.getElementById(id);

let editingId = null;
let currentImage = "";
let unsubscribeProducts = null;
let busy = false;

function show(id, visible) {
  $(id).classList.toggle("hidden", !visible);
}

function explainError(error) {
  const code = error && error.code ? error.code : "";
  const messages = {
    "auth/invalid-email":
      "Email нодуруст аст. Суроғаи email-ро санҷед.",
    "auth/invalid-credential":
      "Email ё парол нодуруст аст. Пароли ҳисоби Firebase-ро санҷед.",
    "auth/wrong-password":
      "Парол нодуруст аст.",
    "auth/user-not-found":
      "Ин email дар ин лоиҳаи Firebase ёфт нашуд.",
    "auth/too-many-requests":
      "Кӯшишҳо зиёд шуданд. Каме интизор шавед ва боз санҷед.",
    "auth/network-request-failed":
      "Интернет ё пайвастшавӣ ба Firebase мушкил дорад.",
    "auth/operation-not-allowed":
      "Усули Email/Password дар Firebase фаъол нест.",
    "permission-denied":
      "Иҷозат рад шуд. Қоидаҳои Firestore-ро санҷед.",
    "unavailable":
      "Firebase муваққатан дастнорас аст. Интернетро санҷед."
  };

  return (messages[code] || "Хатои Firebase. Код: " +
    (code || "номаълум") + ". " +
    (error && error.message ? error.message : ""))
    .replace(/AIza[0-9A-Za-z_-]+/g, "[пинҳон]")
    .replace(/[\r\n]+/g, " ");
}

function setLoginMessage(message) {
  $("loginMsg").textContent = message;
}

function setFormMessage(message) {
  $("formMsg").textContent = message;
}

function setBusy(value) {
  busy = value;
  $("loginBtn").disabled = value;
  $("saveBtn").disabled = value;
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    setLoginMessage("Email ва паролро пур кунед.");
    return;
  }

  setBusy(true);
  setLoginMessage("Дар ҳоли санҷиши воридшавӣ...");

  try {
    const result = await auth.signInWithEmailAndPassword(email, password);

    if (!result.user || result.user.uid !== ADMIN_UID) {
      await auth.signOut();
      setLoginMessage(
        "Ҳисоб ворид шуд, вале UID-и он бо маъмури иҷозатдодашуда мувофиқат намекунад."
      );
      return;
    }

    setLoginMessage("Воридшавӣ муваффақ шуд.");
  } catch (error) {
    setLoginMessage(explainError(error));
  } finally {
    setBusy(false);
  }
});

auth.onAuthStateChanged(async user => {
  if (!user) {
    show("loginCard", true);
    show("adminArea", false);
    if (unsubscribeProducts) {
      unsubscribeProducts();
      unsubscribeProducts = null;
    }
    return;
  }

  if (user.uid !== ADMIN_UID) {
    show("loginCard", true);
    show("adminArea", false);
    setLoginMessage("Ин ҳисоб иҷозати маъмурӣ надорад.");
    await auth.signOut();
    return;
  }

  show("loginCard", false);
  show("adminArea", true);
  $("welcome").textContent = "Маъмур: " + (user.email || "");

  if (!unsubscribeProducts) listenProducts();
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    await auth.signOut();
    resetForm();
    setLoginMessage("Шумо аз ҳисоб баромадед.");
  } catch (error) {
    setLoginMessage(explainError(error));
  }
});

// Фишурдани акс барои маҳдуд нигоҳ доштани андозаи ҳуҷҷат
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) {
      reject(new Error("Файли интихобшуда акс нест."));
      return;
    }

    if (file.size > 12 * 1024 * 1024) {
      reject(new Error("Акс калон аст. Аксро то 12 MB интихоб кунед."));
      return;
    }

    const reader = new FileReader();

    reader.onerror = () => reject(new Error("Акс хонда нашуд."));
    reader.onload = () => {
      const img = new Image();

      img.onerror = () => reject(new Error("Акс кушода нашуд."));
      img.onload = () => {
        const scale = Math.min(1, 700 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        let quality = 0.72;
        let data = canvas.toDataURL("image/jpeg", quality);

        while (data.length > 600000 && quality > 0.3) {
          quality -= 0.1;
          data = canvas.toDataURL("image/jpeg", quality);
        }

        if (data.length > 600000) {
          reject(new Error(
            "Акс ҳанӯз калон аст. Аксро хурдтар интихоб кунед."
          ));
        } else {
          resolve(data);
        }
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

$("imageFile").addEventListener("change", async () => {
  const file = $("imageFile").files[0];
  if (!file) return;

  setFormMessage("Акс омода мешавад...");

  try {
    currentImage = await compressImage(file);
    $("preview").src = currentImage;
    show("preview", true);
    $("imageUrl").value = "";
    setFormMessage("Акс омода аст. Молро сабт кунед.");
  } catch (error) {
    currentImage = "";
    setFormMessage(error.message || explainError(error));
  }
});

$("imageUrl").addEventListener("input", () => {
  if ($("imageUrl").value.trim()) {
    currentImage = "";
    $("imageFile").value = "";
    show("preview", false);
  }
});

$("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;

  const user = auth.currentUser;
  if (!user || user.uid !== ADMIN_UID) {
    setFormMessage("Аввал бо ҳисоби маъмурӣ ворид шавед.");
    return;
  }

  const name = $("name").value.trim();
  const category = $("category").value.trim();
  const price = Number($("price").value);
  const imageUrl = $("imageUrl").value.trim();

  if (!name || !category || !Number.isFinite(price) || price < 0) {
    setFormMessage("Ном, категория ва нархи дурустро пур кунед.");
    return;
  }

  if (imageUrl && !/^https?:\/\//i.test(imageUrl)) {
    setFormMessage("Пайванди акс бояд бо https:// ё http:// оғоз шавад.");
    return;
  }

  if (imageUrl && currentImage) {
    setFormMessage("Як акс интихоб кунед: файл ё пайванди акс.");
    return;
  }

  let image = currentImage || imageUrl;

  // Агар таҳрир шавад ва акс нав интихоб нашавад, акси кӯҳна мемонад.
  if (!image && editingId) {
    image = $("preview").dataset.oldImage || "";
  }

  const data = {
    name,
    price,
    category,
    image,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  setBusy(true);
  setFormMessage("Мол сабт мешавад...");

  try {
    if (editingId) {
      await db.collection("products").doc(editingId).update(data);
      setFormMessage("Мол бомуваффақият тағйир дода шуд.");
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection("products").add(data);
      setFormMessage("Мол бомуваффақият илова шуд.");
    }

    resetForm();
  } catch (error) {
    setFormMessage(explainError(error));
  } finally {
    setBusy(false);
  }
});

function resetForm() {
  editingId = null;
  currentImage = "";
  $("productForm").reset();
  $("preview").removeAttribute("src");
  delete $("preview").dataset.oldImage;
  show("preview", false);
  show("cancelEdit", false);
  $("formTitle").textContent = "➕ Иловаи моли нав";
  $("saveBtn").textContent = "Сабти мол";
}

$("cancelEdit").addEventListener("click", resetForm);

function listenProducts() {
  $("listMsg").textContent = "Молҳо бор мешаванд...";

  unsubscribeProducts = db.collection("products")
    .onSnapshot(snapshot => {
      $("listMsg").textContent = "Ҳамагӣ: " + snapshot.size + " мол";
      const list = $("productsList");
      list.replaceChildren();

      snapshot.forEach(doc => {
        const p = doc.data();
        const item = document.createElement("div");
        item.className = "product";

        const title = document.createElement("h3");
        title.textContent = p.name || "Беном";
        item.appendChild(title);

        if (p.image) {
          const img = document.createElement("img");
          img.src = p.image;
          img.alt = p.name || "Акси мол";
          img.loading = "lazy";
          item.appendChild(img);
        }

        const details = document.createElement("p");
        details.textContent =
          "Нарх: " + (p.price ?? 0) + " сомонӣ | Категория: " +
          (p.category || "—");
        item.appendChild(details);

        const edit = document.createElement("button");
        edit.textContent = "Таҳрир";
        edit.addEventListener("click", () => {
          editingId = doc.id;
          currentImage = "";
          $("name").value = p.name || "";
          $("price").value = p.price ?? "";
          $("category").value = p.category || "";
          $("imageUrl").value = "";
          $("imageFile").value = "";
          $("preview").dataset.oldImage = p.image || "";

          if (p.image && p.image.startsWith("data:image/")) {
            $("preview").src = p.image;
            show("preview", true);
          } else {
            show("preview", false);
            $("imageUrl").value = p.image || "";
          }

          $("formTitle").textContent = "✏️ Таҳрири мол";
          $("saveBtn").textContent = "Сабти тағйирот";
          show("cancelEdit", true);
          $("productForm").scrollIntoView({ behavior: "smooth" });
        });
        item.appendChild(edit);

        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Нест кардан";
        del.addEventListener("click", async () => {
          if (!confirm('Моли "' + (p.name || "") + '" нест карда шавад?')) {
            return;
          }

          try {
            await db.collection("products").doc(doc.id).delete();
            $("listMsg").textContent = "Мол нест карда шуд.";
          } catch (error) {
            $("listMsg").textContent = explainError(error);
          }
        });
        item.appendChild(del);
        list.appendChild(item);
      });
    }, error => {
      $("listMsg").textContent = explainError(error);
    });
}
</script>
</body>
</html>
