
<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>Мастчоҳ Шоп — Мағозаи онлайн</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #202a25;
    }
    header {
      background: #087f5b;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; }
    .wrap { max-width: 1050px; margin: auto; padding: 15px; }
    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5cf;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 14px;
    }
    .categories button, .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      background: #087f5b;
      color: white;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .categories button { background: #e0eee7; color: #14563e; }
    .categories button.active { background: #087f5b; color: white; }
    h2 { font-size: 21px; }
    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .product {
      background: white;
      border-radius: 13px;
      padding: 13px;
      box-shadow: 0 2px 8px #0000000c;
    }
    .photo {
      background: #eaf4ee;
      border-radius: 10px;
      min-height: 100px;
      display: grid;
      place-items: center;
      font-size: 48px;
    }
    .product h3 { font-size: 16px; margin: 12px 0 7px; }
    .price { color: #087f5b; font-weight: bold; margin: 8px 0 12px; }
    .product .btn { width: 100%; white-space: normal; }
    .cart, .checkout {
      background: white;
      border-radius: 13px;
      padding: 16px;
      margin-top: 22px;
    }
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #edf0ed;
      padding: 10px 0;
    }
    .qty { display: flex; align-items: center; gap: 9px; }
    .qty button {
      border: 0; border-radius: 6px;
      padding: 6px 10px; background: #e0eee7;
    }
    .total { font-size: 19px; font-weight: bold; margin-top: 15px; }
    .field {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5cf;
      border-radius: 8px;
      font-size: 16px;
      margin: 7px 0 12px;
    }
    .checkout .btn { width: 100%; font-size: 16px; }
    .empty { color: #66736b; }
    footer {
      text-align: center; padding: 24px 12px;
      color: #617068; font-size: 14px;
    }
    @media (min-width: 650px) {
      .products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      header h1 { font-size: 34px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🛍️ Мастчоҳ Шоп</h1>
  <p>Мағозаи онлайн — харид осон ва қулай!</p>
</header>

<main class="wrap">
  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔍 Молро ҷустуҷӯ кунед..."
    aria-label="Ҷустуҷӯи мол"
  >

  <div class="categories" id="categories"></div>

  <h2>🛒 Молҳои мо</h2>
  <div class="products" id="products"></div>

  <section class="cart" id="cart">
    <h2>🛍️ Сабади харид</h2>
    <div id="cartItems" class="empty">Сабад ҳоло холӣ аст.</div>
    <div id="total" class="total">Ҳамагӣ: 0 сомонӣ</div>
  </section>

  <section class="checkout">
    <h2>📦 Фармоиш додан</h2>
    <form id="orderForm">
      <label for="customerName">Ному насаб</label>
      <input class="field" id="customerName" required
        placeholder="Номи худро нависед">

      <label for="phone">Рақами телефони шумо</label>
      <input class="field" id="phone" type="tel" required
        placeholder="+992..." >

      <label for="address">Суроғаи расонидан</label>
      <textarea class="field" id="address" rows="3" required
        placeholder="Ноҳия, деҳа ё суроғаи шумо"></textarea>

      <button class="btn" type="submit">
        📲 Фармоиш тавассути WhatsApp
      </button>
    </form>
    <p style="font-size:13px;color:#66736b">
      Пас аз пахш кардан, WhatsApp кушода мешавад.
      Барои фиристодан паёмро дар WhatsApp тасдиқ кунед.
    </p>
  </section>
</main>

<footer>
  © 2026 Мастчоҳ Шоп · Ҳамаи ҳуқуқҳо ҳифз шудаанд.
</footer>

<script>
  // Рақами WhatsApp-и мағоза
  const WHATSAPP_NUMBER = "79964468762";

  // Молҳо ва нархҳои намунавӣ — онҳоро метавонед иваз кунед
  const productsData = [
    { id: 1, name: "Зарядник Type-C", category: "Зарядник", price: 25, icon: "🔌" },
    { id: 2, name: "Кабели USB", category: "Кабел", price: 15, icon: "🔗" },
    { id: 3, name: "Чехоли телефон", category: "Чехол", price: 20, icon: "📱" },
    { id: 4, name: "Шишаи муҳофизатӣ", category: "Шиша", price: 10, icon: "🛡️" },
    { id: 5, name: "Гӯшмонак", category: "Гӯшмонак", price: 45, icon: "🎧" },
    { id: 6, name: "Power Bank", category: "Power Bank", price: 120, icon: "🔋" },
    { id: 7, name: "Дорандаи телефон", category: "Доранда", price: 35, icon: "📲" },
    { id: 8, name: "Кроссовка", category: "Пойафзол", price: 350, icon: "👟" }
  ];

  let cart = {};
  let selectedCategory = "Ҳама";

  const productsEl = document.getElementById("products");
  const categoriesEl = document.getElementById("categories");
  const cartItemsEl = document.getElementById("cartItems");
  const totalEl = document.getElementById("total");
  const searchEl = document.getElementById("search");

  function money(amount) {
    return amount.toLocaleString("en-US") + " сомонӣ";
  }

  function renderCategories() {
    const categories = ["Ҳама", ...new Set(
      productsData.map(p => p.category)
    )];

    categoriesEl.innerHTML = categories.map(category => `
      <button
        type="button"
        class="${category === selectedCategory ? "active" : ""}"
        data-category="${category}">
        ${category}
      </button>
    `).join("");

    categoriesEl.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;
        renderCategories();
        renderProducts();
      });
    });
  }

  function renderProducts() {
    const query = searchEl.value.trim().toLowerCase();

    const filtered = productsData.filter(p => {
      const matchesCategory =
        selectedCategory === "Ҳама" ||
        p.category === selectedCategory;
      const matchesSearch =
        (p.name + " " + p.category).toLowerCase().includes(query);
      return matchesCategory && matchesSearch;
    });

    if (!filtered.length) {
      productsEl.innerHTML = '<p class="empty">Мол ёфт нашуд.</p>';
      return;
    }

    productsEl.innerHTML = filtered.map(p => `
      <article class="product">
        <div class="photo">${p.icon}</div>
        <h3>${p.name}</h3>
        <div class="price">${money(p.price)}</div>
        <button class="btn" type="button" data-add="${p.id}">
          ➕ Ба сабад
        </button>
      </article>
    `).join("");

    productsEl.querySelectorAll("[data-add]").forEach(button => {
      button.addEventListener("click", () => {
        const id = Number(button.dataset.add);
        cart[id] = (cart[id] || 0) + 1;
        renderCart();
      });
    });
  }

  function renderCart() {
    const items = productsData.filter(p => cart[p.id] > 0);

    if (!items.length) {
      cartItemsEl.innerHTML =
        '<p class="empty">Сабад ҳоло холӣ аст.</p>';
    } else {
      cartItemsEl.innerHTML = items.map(p => `
        <div class="cart-row">
          <div>
            <strong>${p.name}</strong><br>
            <small>${money(p.price)} × ${cart[p.id]}</small>
          </div>
          <div class="qty">
            <button type="button" data-minus="${p.id}">−</button>
            <span>${cart[p.id]}</span>
            <button type="button" data-plus="${p.id}">+</button>
          </div>
        </div>
      `).join("");
    }

    const total = items.reduce(
      (sum, p) => sum + p.price * cart[p.id], 0
    );
    totalEl.textContent = "Ҳамагӣ: " + money(total);

    cartItemsEl.querySelectorAll("[data-minus]").forEach(button => {
      button.addEventListener("click", () => {
        const id = Number(button.dataset.minus);
        cart[id]--;
        if (cart[id] <= 0) delete cart[id];
        renderCart();
      });
    });

    cartItemsEl.querySelectorAll("[data-plus]").forEach(button => {
      button.addEventListener("click", () => {
        const id = Number(button.dataset.plus);
        cart[id]++;
        renderCart();
      });
    });
  }

  searchEl.addEventListener("input", renderProducts);

  document.getElementById("orderForm").addEventListener("submit", event => {
    event.preventDefault();

    const items = productsData.filter(p => cart[p.id] > 0);
    if (!items.length) {
      alert("Аввал ба сабад мол илова кунед.");
      document.getElementById("cart").scrollIntoView();
      return;
    }

    const name = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();

    const orderLines = items.map(p =>
      `• ${p.name} — ${cart[p.id]} дона × ${p.price} = ${p.price * cart[p.id]} сомонӣ`
    );

    const total = items.reduce(
      (sum, p) => sum + p.price * cart[p.id], 0
    );

    const message = [
      "Салом! Ман аз Мастчоҳ Шоп фармоиш медиҳам.",
      "",
      "Молҳо:",
      ...orderLines,
      "",
      "Ҳамагӣ: " + total + " сомонӣ",
      "",
      "Ном: " + name,
      "Телефон: " + phone,
      "Суроға: " + address
    ].join("\n");

    const url = "https://wa.me/" + WHATSAPP_NUMBER +
      "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
  });

  renderCategories();
  renderProducts();
  renderCart();
</script>
</body>
</html>
